<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Dungeon Crawler Roguelike</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      background: #000;
      overflow: hidden;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    canvas { display: block; }
  </style>
</head>
<body>
  <!-- Phaser 3 from CDN -->
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>

  <!-- Game constants (must load first) -->
  <script src="src/constants.js"></script>

  <!-- Config tables -->
  <script src="src/config/enemies.js"></script>
  <script src="src/config/items.js"></script>
  <script src="src/config/perks.js"></script>
  <script src="src/config/skills.js"></script>

  <!-- Systems -->
  <script src="src/systems/DungeonGenerator.js"></script>

  <!-- Entities -->
  <script src="src/entities/Enemy.js"></script>
  <script src="src/entities/Player.js"></script>

  <!-- UI -->
  <script src="src/ui/HUD.js"></script>
  <script src="src/ui/Controls.js"></script>

  <!-- Scenes (order matters for dependencies) -->
  <script src="src/scenes/BootScene.js"></script>
  <script src="src/scenes/MenuScene.js"></script>
  <script src="src/scenes/PauseScene.js"></script>
  <script src="src/scenes/LevelUpScene.js"></script>
  <script src="src/scenes/GameOverScene.js"></script>
  <script src="src/scenes/GameScene.js"></script>

  <!-- Bootstrap -->
  <script src="src/main.js"></script>
</body>
</html>
